# Thaler's configuration: ~/.config/thaler/config.toml, or the file given with --config.
# Copy this example there to start. In the TUI, press C to open the config in your editor.
# Every key is explained in docs/config.md of Thaler's repository. Unknown keys are
# rejected, so a typo cannot silently disable a rule. Keys are lower case: `Rule` or
# `Language` is a typo too.

# The language of Thaler's messages: "en", "es" or "de". Without this key the
# environment decides (LC_ALL, LC_MESSAGES, then LANG, as in de_DE.UTF-8), and a
# language Thaler does not speak is English. A message not yet translated is shown
# in English. In the TUI, ctrl+l chooses the language and writes this line for you.
# language = "de"

# The colours of the interface: "auto" (the default) follows the terminal's
# background, "dark" and "light" fix them for a terminal that does not say what its
# background is (some multiplexers, a session over ssh). In the TUI, ctrl+t chooses
# the theme and writes this line for you.
# theme = "dark"

# The folder the interface lists bank exports from when you press `i` to import
# (default: ~/Downloads). You can always type or drop another file or folder.
# import_dir = "~/Documents/bank-exports"

# While it runs, the interface looks at that folder every few seconds, only at the
# names and times of its CSV files, and says in the bottom bar when a new one has
# arrived (default: true). false stops it looking.
# watch_import_dir = false

# The interface reminds you to back up when the newest backup in the backups
# folder is this many days old, or there is none and you have transactions
# (default: 7). 0 switches the reminder off.
# backup_reminder_days = 14

# How many of the newest backups to keep in each backups folder (default: 10).
# Thaler never deletes one by itself: when there are more, the interface offers
# to remove the oldest (ctrl+p), and `thaler cli prune` lists them first. The same
# number applies to the backups you make, the databases that restores replaced
# and the copies made before upgrades. 0 keeps everything and stops the offer.
# keep_backups = 20

# A story that is merged before it is finished stays off until you switch it on
# here, so it cannot hold up a release; try one if you want to see it early. A
# name that does not exist is refused, and the error lists the ones that do.
# Nothing is behind a flag in this version.
# [features]
# some_feature = true

# ---------------------------------------------------------------------------
# Categorisation rules for `thaler cli import`.
#
# Rules are checked top to bottom; the first match wins. A rule needs exactly
# one of `contains` (case-insensitive substring) or `regex` (case-insensitive
# regular expression), matched against "payee + purpose + booking text".
# Categories that do not exist yet are created on import.
# ---------------------------------------------------------------------------

[[rule]]
contains = "REWE"
category = "Expenses:Groceries"

[[rule]]
regex = "b(ä|ae)ckerei|edeka|lidl|aldi"
category = "Expenses:Groceries"

[[rule]]
contains = "Hausverwaltung"
category = "Expenses:Rent"

[[rule]]
contains = "Gehalt"
category = "Income:Salary"

[[rule]]
contains = "ENTGELTABSCHLUSS"
category = "Expenses:BankFees"

# Money moved between your own accounts. Use Equity:Transfers for it: it is not
# income or spending, and when you import the other account's export the two
# halves are paired automatically (same amount, within three days). Thaler also
# pairs them without a rule; a rule just marks one that has no other half yet.
# Do not point such a rule at an Assets account: both exports would then book it.
# [[rule]]
# contains = "Umbuchung Sparen"
# category = "Equity:Transfers"

# ---------------------------------------------------------------------------
# Custom CSV profile, only needed for banks other than the built-in
# `sparkasse` profile. Found from the file ("auto"), or chosen with:
# thaler cli import --profile mybank FILE ...
# In the interface the profile is found from the file's header ("auto"): this one
# is chosen for a file that has its date and amount columns.
# Header names are matched ignoring case; ä/ö/ü/ß count as ae/oe/ue/ss.
# Dates use DD, MM, YY, YYYY.
# ---------------------------------------------------------------------------

# [[profile]]
# name = "mybank"
# delimiter = ","                 # one character, or "auto" (default): ; , tab or |, found from the header
# encoding = "utf-8"              # "auto" (default), "utf-8", "utf-16", "utf-16le", "utf-16be" or "windows-1252"
# decimal_separator = "."         # "," or "."; leave out to detect per amount
# date_formats = ["YYYY-MM-DD"]
# skip_column = "Status"          # ignore rows whose Status contains "pending"
# skip_contains = "pending"
#
# [profile.columns]
# date = ["Date"]
# payee = ["Description"]
# purpose = ["Reference"]
# iban = ["IBAN"]
# booking_text = ["Type"]
# amount = ["Amount"]
# currency = ["Currency"]
#
# OFX and QIF files need no profile: the built-in "ofx" and "qif" read them, and
# "auto" recognises them. A QIF file's dates have no fixed order; if your bank
# writes them day first with slashes (04/10/26), give it a profile of its own:
#
# [[profile]]
# name = "mybank-qif"
# format = "qif"                  # "csv" (default), "ofx" or "qif"
# date_formats = ["DD/MM/YY"]
# decimal_separator = ","         # if its amounts have a decimal comma
