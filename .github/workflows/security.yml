name: Security

on:
  push:
    branches: [main]
  pull_request:
  # Advisories appear without anyone changing this repository, so look weekly too.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  # A change to documentation only cannot add a vulnerability, so the scan skips it.
  # The weekly run and pushes to main always scan.
  changes:
    uses: ./.github/workflows/changes.yml

  govulncheck:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The newest toolchain, not the minimum in go.mod: a vulnerability in the
          # standard library is only fixed in a newer patch release, and that is what
          # people building Thaler get.
          go-version: stable
      - name: govulncheck
        run: make vuln
