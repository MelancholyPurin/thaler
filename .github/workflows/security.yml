name: Security

on:
  push:
    branches: [main]
  pull_request:
  # Advisories appear without anyone changing this repository, so look weekly too.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  # A change to documentation only cannot add a vulnerability, so the scan skips it.
  # The weekly run and pushes to main always scan.
  changes:
    uses: ./.github/workflows/changes.yml

  govulncheck:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # The Go the release is built with (release.yml): the newest patch of the
          # minor version in go.mod, not the 1.27.0 it names, since a vulnerability
          # in the standard library is fixed in a patch release. Scanning with the
          # newest minor version instead would miss what the release ships with.
          go-version: "1.27"
      - name: govulncheck
        run: make vuln
