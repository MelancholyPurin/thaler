name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Whether the Go checks are needed at all: a change to documentation only skips
  # them. It is decided per job, not with `paths-ignore` on the workflow, so that
  # the result check below is still reported and a pull request can be merged.
  changes:
    uses: ./.github/workflows/changes.yml

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: lint
        run: make lint
      - name: go.mod is tidy
        run: make tidy-check
      - name: CI scripts
        run: make test-scripts

  # Linux and macOS, because Thaler runs on both and they differ in details that
  # matter to it (paths, file modes, how SQLite locks files). `go test` is what
  # `make test` runs; it is used here because make is not on every runner.
  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: test
        run: go test -shuffle=on ./...

  # Windows is a supported platform (PLT-5), but the tests were written on Unix and
  # still assume it. What fails there, as of the first run:
  #   - expected paths written with forward slashes, where Windows has backslashes;
  #   - error text from the operating system ("no such file or directory");
  #   - Unix file modes (0600, 0700), which Windows does not report;
  #   - file names with a question mark, which Windows does not allow;
  #   - the drag-and-drop path cleaning in the TUI (`my\ file`), which is Unix shell escaping.
  # Until the tests are portable this job runs to show what fails, but it must not
  # look like a block: a failed job is a red check on the pull request, even when
  # nothing requires it. So the failing step is allowed to fail, and the job says so
  # in a warning. It is also kept out of the result check below. When the tests
  # pass, make the step required and move this job into the `test` matrix.
  test-windows:
    name: test (windows-latest, not required yet)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: test
        id: tests
        continue-on-error: true
        run: go test -shuffle=on ./...
      - name: say so when the tests failed
        if: steps.tests.outcome == 'failure'
        run: echo "::warning title=The Windows tests fail (PLT-5)::This job is not required yet. See the log of the test step for what failed."

  # Its own job so it runs beside the others instead of after them: the race
  # detector makes the tests several times slower.
  race:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: test with the race detector
        run: make test-race

  # One check that stands for all the others. Require this one in branch protection,
  # so jobs can be added, renamed or split without touching the repository settings.
  #
  # It passes when every Go job passed, or, for a change to documentation only,
  # when every Go job was skipped because the `changes` job said they were not
  # needed. A job that was skipped when it was needed, one that failed and one that
  # was cancelled all make it fail.
  result:
    name: Report Result
    if: always() # a failed job must make this fail, not skip it
    needs: [changes, lint, test, race]
    runs-on: ubuntu-latest
    steps:
      - name: every job that was needed passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '
            (.changes.outputs.go == "true") as $needed
            | .changes.result == "success"
              and all([.lint, .test, .race][]; .result == (if $needed then "success" else "skipped" end))
          ' > /dev/null
