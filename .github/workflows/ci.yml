name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Whether the Go checks are needed at all: a change to documentation only skips
  # them. It is decided per job, not with `paths-ignore` on the workflow, so that
  # the result check below is still reported and a pull request can be merged.
  changes:
    uses: ./.github/workflows/changes.yml

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: lint
        run: make lint
      - name: go.mod is tidy
        run: make tidy-check
      - name: CI scripts
        run: make test-scripts

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: make test

  # Its own job so it runs beside the others instead of after them: the race
  # detector makes the tests several times slower.
  race:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test with the race detector
        run: make test-race

  # One check that stands for all the others. Require this one in branch protection,
  # so jobs can be added, renamed or split without touching the repository settings.
  #
  # It passes when every Go job passed, or, for a change to documentation only,
  # when every Go job was skipped because the `changes` job said they were not
  # needed. A job that was skipped when it was needed, one that failed and one that
  # was cancelled all make it fail.
  result:
    name: Report Result
    if: always() # a failed job must make this fail, not skip it
    needs: [changes, lint, test, race]
    runs-on: ubuntu-latest
    steps:
      - name: every job that was needed passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '
            (.changes.outputs.go == "true") as $needed
            | .changes.result == "success"
              and all([.lint, .test, .race][]; .result == (if $needed then "success" else "skipped" end))
          ' > /dev/null
