# GoReleaser builds and publishes a release: the archives for macOS and Linux, their
# checksums, the signature of the checksums, and the GitHub release. The release workflow runs it (see
# .github/workflows/release.yml and the release train in ROADMAP.md); `make
# release-check` checks this file and builds the archives into dist/ without
# publishing anything. Its version is pinned in the Makefile.
version: 2
project_name: thaler

builds:
  - id: thaler
    main: ./cmd/thaler
    binary: thaler
    env:
      - CGO_ENABLED=0 # the SQLite driver is pure Go, so every target builds from one machine
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version=v{{ .Version }} # what `thaler --version` prints
    mod_timestamp: "{{ .CommitTimestamp }}" # the same commit gives the same bytes

archives:
  - id: thaler
    formats: [tar.gz]
    name_template: "thaler_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - config.example.toml

checksum:
  name_template: checksums.txt
  algorithm: sha256

# The checksums are signed with cosign, keyless (REL-11): in the Release workflow,
# cosign proves who it is to Sigstore with GitHub's OIDC token, and the bundle it
# writes holds the signature and a certificate naming the workflow and branch. One
# signature covers every archive, since checksums.txt names them all. Signing needs
# that token, so `make release-check` skips it unless SIGN=1 (the workflow's dry run
# signs). cosign is pinned in the Makefile and put on the PATH there;
# .github/scripts/verify-release.sh checks the result.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, "--bundle=${signature}", --yes, "${artifact}"]
    output: true

# The Homebrew package (PLT-7): a cask in the tap MelancholyPurin/homebrew-tap, so
# `brew install melancholypurin/tap/thaler` installs the archive of the release for
# the machine, on macOS and Linux, after checking it against the same sha256 as
# checksums.txt. Publishing commits the cask to the tap with HOMEBREW_TAP_TOKEN (a
# token that can write to that repository only; GITHUB_TOKEN cannot); `make
# release-check` writes it to dist/homebrew/ without one. A pre-release (v0.3.0-rc.1)
# is not put in the tap.
homebrew_casks:
  - name: thaler
    ids: [thaler]
    repository:
      owner: MelancholyPurin
      name: homebrew-tap
      token: '{{ index .Env "HOMEBREW_TAP_TOKEN" }}'
    directory: Casks
    commit_msg_template: "thaler {{ .Tag }}"
    homepage: https://github.com/MelancholyPurin/thaler
    description: Local-first personal finance planner for the terminal
    license: AGPL-3.0-only
    skip_upload: auto
    binaries: [thaler]
    hooks:
      post:
        # Homebrew marks what a cask downloads as quarantined, and macOS refuses to
        # run a binary that is so marked and not notarized by Apple (the README's
        # xattr step, done here). Homebrew has checked the sha256 first.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/thaler"]
          end

# The notes come from cmd/releasenotes (REL-5) and are passed in with
# --release-notes, so GoReleaser writes no changelog of its own.
changelog:
  disable: true

release:
  github:
    owner: melancholypurin
    name: thaler
  name_template: "{{ .Tag }}"
  prerelease: auto # a tag like v0.3.0-rc.1 is marked as a pre-release

snapshot:
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"
